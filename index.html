<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terminal Pikachu — ASCII Portrait Effect</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>ASCII Portrait</h1>
    <p class="sub">Canvas2D recreation of the <a href="https://21st.dev/community/ascii" target="_blank" rel="noopener">21st.dev "Terminal Pikachu"</a> effect.</p>
    <div class="stage">
      <canvas id="canvas" width="640" height="640"></canvas>
    </div>
    <p class="hint">Click the canvas to pause/resume the animation.</p>
  </main>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
